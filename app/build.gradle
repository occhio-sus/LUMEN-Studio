plugins {
    id 'com.android.application'
}

android {
    namespace 'it.studioflow.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.studioflow.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
