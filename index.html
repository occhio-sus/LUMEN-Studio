<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen — Smart AI Study Companion</title>
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:;">

  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://images.unsplash.com">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; text-rendering: optimizeSpeed; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
    
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="h-full flex text-slate-100 overflow-hidden select-none">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between transition-all duration-300 z-20">
    <div class="p-4">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">💡</div>
          <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Lumen</span>
        </div>
        <button id="toggle-sidebar-btn" class="p-1.5 text-slate-400 hover:text-white rounded-md hover:bg-slate-800">
          <i data-lucide="sidebar" class="w-5 h-5"></i>
        </button>
      </div>

      <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition shadow-md shadow-indigo-600/20 mb-4">
        <i data-lucide="plus" class="w-4 h-4"></i> Nuova Sessione
      </button>

      <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 px-1">Sessioni Recenti</div>
      <div id="history-list" class="space-y-1 chat-scroll overflow-y-auto max-h-[calc(100vh-220px)]"></div>
    </div>

    <div class="p-4 border-t border-slate-800/80 text-xs text-slate-500 flex items-center justify-between">
      <span>Lumen v1.0 • Secure AI</span>
      <a href="./TERMS.md" target="_blank" class="hover:text-slate-300 underline">Termini</a>
    </div>
  </aside>

  <!-- Area Principale Chat Fullscreen -->
  <main class="flex-1 flex flex-col h-full bg-slate-950 relative">

    <header class="h-14 border-b border-slate-800/60 px-6 flex items-center justify-between bg-slate-950/80 backdrop-blur-md z-10">
      <div class="flex items-center gap-3">
        <h1 id="session-title" class="font-semibold text-slate-200">Sessione di Studio</h1>
        <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">Attivo</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <button id="download-app-btn" onclick="downloadAppCode()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 text-xs font-medium transition">
          <i data-lucide="download" class="w-4 h-4"></i> Scarica App
        </button>
        <button id="clear-chat-btn" class="text-slate-400 hover:text-rose-400 transition flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-rose-500/10 text-xs">
          <i data-lucide="trash-2" class="w-4 h-4"></i> Cancella
        </button>
      </div>
    </header>

    <section id="chat-feed" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 chat-scroll max-w-4xl mx-auto w-full">
      <div id="welcome-card" class="glass-card p-6 md:p-8 rounded-2xl border border-slate-800 text-center max-w-xl mx-auto my-auto space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center mx-auto border border-indigo-500/30">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">Cosa vuoi studiare oggi?</h2>
        <p class="text-slate-400 text-sm leading-relaxed">
          Incolla appunti, fai domande oppure trascina foto di libri e schemi. Dopo la risposta potrai generare al volo **Flashcard 3D**, **Quiz**, **Podcast** o **Riassunti**.
        </p>
      </div>
    </section>

    <footer class="p-4 md:p-6 bg-slate-950 border-t border-slate-900 z-10">
      <div class="max-w-4xl mx-auto relative">
        <div id="file-preview-container" class="hidden mb-3 p-2 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-between w-max max-w-xs">
          <div class="flex items-center gap-2 overflow-hidden">
            <i data-lucide="file-text" class="w-4 h-4 text-indigo-400 shrink-0"></i>
            <span id="file-preview-name" class="text-xs text-slate-300 truncate"></span>
          </div>
          <button id="remove-file-btn" class="p-1 text-slate-500 hover:text-white"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>

        <form id="chat-form" class="flex items-end gap-2 bg-slate-900 border border-slate-800 rounded-2xl p-2 focus-within:border-indigo-500/50 transition">
          <label for="file-input" class="p-3 text-slate-400 hover:text-slate-200 cursor-pointer rounded-xl hover:bg-slate-800 transition">
            <i data-lucide="paperclip" class="w-5 h-5"></i>
            <input type="file" id="file-input" class="hidden" accept="image/*,.pdf,.txt,.md">
          </label>
          <textarea id="user-input" rows="1" placeholder="Scrivi i tuoi appunti o fai una domanda..." class="flex-1 bg-transparent border-0 resize-none text-slate-100 placeholder-slate-500 focus:ring-0 p-3 max-h-36 chat-scroll text-sm"></textarea>
          <button type="submit" id="send-btn" class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-md shadow-indigo-600/20 disabled:opacity-50">
            <i data-lucide="send" class="w-5 h-5"></i>
          </button>
        </form>
      </div>
    </footer>
  </main>

  <script>
    function sanitizeHTML(str) {
      const temp = document.createElement('div');
      temp.textContent = str;
      return temp.innerHTML;
    }

    function downloadAppCode() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    let currentAttachment = null;
    const chatFeed = document.getElementById('chat-feed');
    const userInput = document.getElementById('user-input');
    const chatForm = document.getElementById('chat-form');
    const welcomeCard = document.getElementById('welcome-card');
    const fileInput = document.getElementById('file-input');
    const filePreviewContainer = document.getElementById('file-preview-container');
    const filePreviewName = document.getElementById('file-preview-name');
    const removeFileBtn = document.getElementById('remove-file-btn');

    lucide.createIcons();

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 144) + 'px';
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        alert("Il file supera il limite massimo di 10MB.");
        fileInput.value = '';
        return;
      }
      currentAttachment = file;
      filePreviewName.textContent = file.name;
      filePreviewContainer.classList.remove('hidden');
    });

    removeFileBtn.addEventListener('click', () => {
      currentAttachment = null;
      fileInput.value = '';
      filePreviewContainer.classList.add('hidden');
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text && !currentAttachment) return;

      if (welcomeCard) welcomeCard.remove();
      appendUserMessage(text, currentAttachment ? currentAttachment.name : null);
      
      userInput.value = '';
      userInput.style.height = 'auto';
      currentAttachment = null;
      fileInput.value = '';
      filePreviewContainer.classList.add('hidden');

      setTimeout(() => {
        appendAIMessage(text);
      }, 700);
    });

    function appendUserMessage(text, fileName) {
      const msgDiv = document.createElement('div');
      msgDiv.className = "flex flex-col items-end gap-1";
      msgDiv.innerHTML = `
        <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-lg text-sm shadow-sm">
          ${fileName ? `<div class="text-xs bg-indigo-700/60 border border-indigo-500/40 rounded px-2 py-1 mb-2">📎 ${sanitizeHTML(fileName)}</div>` : ''}
          ${sanitizeHTML(text)}
        </div>
      `;
      chatFeed.appendChild(msgDiv);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function appendAIMessage(userQuery) {
      const msgDiv = document.createElement('div');
      msgDiv.className = "flex flex-col items-start gap-3 w-full";
      const textResponse = `Ecco una spiegazione chiara e strutturata dell'argomento in risposta a: **"${sanitizeHTML(userQuery)}"**.\n\nIl concetto principale riguarda la suddivisione delle nozioni in blocchi logici per facilitare la memorizzazione a lungo termine.`;

      msgDiv.innerHTML = `
        <div class="flex items-start gap-3 max-w-2xl">
          <div class="w-8 h-8 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center shrink-0">💡</div>
          <div class="glass-card rounded-2xl rounded-tl-none p-4 text-sm text-slate-200 space-y-3">
            <p>${textResponse}</p>
            <div class="pt-3 border-t border-slate-800 flex flex-wrap gap-2">
              <button onclick="generateResource('flashcard', this)" class="text-xs font-medium bg-slate-800 hover:bg-slate-700 text-indigo-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 border border-indigo-500/20">
                🎴 Crea Flashcards
              </button>
              <button onclick="generateResource('quiz', this)" class="text-xs font-medium bg-slate-800 hover:bg-slate-700 text-emerald-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 border border-emerald-500/20">
                🧩 Genera Quiz
              </button>
              <button onclick="generateResource('podcast', this)" class="text-xs font-medium bg-slate-800 hover:bg-slate-700 text-amber-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 border border-amber-500/20">
                🎙️ Genera Podcast
              </button>
            </div>
          </div>
        </div>
        <div class="resource-container w-full pl-11"></div>
      `;

      chatFeed.appendChild(msgDiv);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    window.generateResource = function(type, btnElement) {
      const container = btnElement.closest('.flex-col').querySelector('.resource-container');
      btnElement.disabled = true;
      btnElement.classList.add('opacity-50');

      if (type === 'flashcard') {
        container.innerHTML = `
          <div class="mt-2 glass-card p-4 rounded-xl border border-indigo-500/30 max-w-md">
            <div class="text-xs text-indigo-400 font-semibold mb-2">FLASHCARD INTERATTIVA (Clicca per girare)</div>
            <div onclick="this.classList.toggle('rotate-y-180')" class="perspective-1000 h-32 w-full cursor-pointer">
              <div class="relative w-full h-full duration-500 transform-style-3d">
                <div class="absolute inset-0 bg-slate-800 rounded-xl p-4 flex items-center justify-center text-center text-sm font-medium border border-slate-700 backface-hidden">
                  Qual è il principio base dell'effetto Feynman?
                </div>
                <div class="absolute inset-0 bg-indigo-900/80 rounded-xl p-4 flex items-center justify-center text-center text-sm font-medium border border-indigo-500/50 rotate-y-180 backface-hidden">
                  Spiegare un concetto con parole semplici come se lo si dovesse insegnare a un bambino.
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (type === 'quiz') {
        container.innerHTML = `
          <div class="mt-2 glass-card p-4 rounded-xl border border-emerald-500/30 max-w-md space-y-3">
            <div class="text-xs text-emerald-400 font-semibold">QUIZ / INDOVINELLO</div>
            <p class="text-sm">Quale tecnica migliora la ritenzione della memoria nel tempo?</p>
            <div class="space-y-1.5">
              <button onclick="alert('Esatto!')" class="w-full text-left text-xs p-2 rounded-lg bg-slate-800 hover:bg-emerald-950/40 hover:border-emerald-500/40 border border-slate-700 transition">A. Ripetizione Dilazionata (Spaced Repetition)</button>
              <button onclick="alert('Riprova!')" class="w-full text-left text-xs p-2 rounded-lg bg-slate-800 hover:bg-rose-950/40 border border-slate-700 transition">B. Rilettura passiva</button>
            </div>
          </div>
        `;
      } else if (type === 'podcast') {
        container.innerHTML = `
          <div class="mt-2 glass-card p-3 rounded-xl border border-amber-500/30 max-w-md flex items-center gap-3">
            <button onclick="this.firstElementChild.classList.toggle('hidden')" class="w-10 h-10 rounded-full bg-amber-500/20 text-amber-300 flex items-center justify-center border border-amber-500/40">
              ▶️
            </button>
            <div>
              <div class="text-xs font-semibold text-amber-300">Pillola Audio Podcast</div>
              <div class="text-xs text-slate-400">Durata: 1:15 • Generato da Lumen AI</div>
            </div>
          </div>
        `;
      }
      chatFeed.scrollTop = chatFeed.scrollHeight;
    };
  </script>
</body>
</html>
